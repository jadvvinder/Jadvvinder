<body class="bg-light dark:bg-dark text-textLight dark:text-textDark transition-colors duration-300">
    <header role="banner">
        <nav class="fixed top-0 left-0 right-0 bg-light/80 dark:bg-dark/80 backdrop-blur-md z-50 border-b border-gray-200/50 dark:border-gray-800/50" aria-label="Main Navigation">

                <div class="flex items-center space-x-10">

                        <i id="moonIcon" class="fa-solid fa-moon hidden"></i>

    <main id="main-content">
        <section class="min-h-screen flex items-center pt-20 px-8">

                <h1 class="text-6xl md:text-8xl font-light mb-8 tracking-tighter leading-none">

                <p class="text-2xl md:text-3xl text-gray-500 max-w-2xl mb-10">
                    Solving complexity through design systems, data-driven platforms, and human-centered strategy.
                </p>
                <div class="flex gap-4">
                    <a href="#work" class="px-8 py-4 bg-purple-600 text-white rounded-full font-semibold">View Projects</a>
                </div>
            </div>
        </section>

        <section id="work" class="py-32 px-8 bg-grayLight dark:bg-grayDark/50">
            <div class="max-w-7xl mx-auto">
                <h2 class="text-4xl font-light mb-20">Selected <span class="font-bold">Work</span></h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="group bg-light dark:bg-dark rounded-3xl overflow-hidden border border-gray-200 dark:border-gray-800">
                        <img src="img/ds_img1.png" alt="Booking.com Design System" class="w-full">
                        <div class="p-8">
                            <h3 class="text-2xl font-bold mb-2">Booking.com Design System</h3>
                            <a href="project5.html" class="text-purple-600 font-bold">View Case Study →</a>
                        </div>
                    </div>
                    <div class="group bg-light dark:bg-dark rounded-3xl overflow-hidden border border-gray-200 dark:border-gray-800">
                        <img src="img/ab_img1.png" alt="A/B Testing Infrastructure" class="w-full">
                        <div class="p-8">
                            <h3 class="text-2xl font-bold mb-2">A/B Testing Infrastructure</h3>

                    </div>

    </main>

    <footer class="py-20 border-t border-gray-200 dark:border-gray-800">
        <div class="max-w-7xl mx-auto px-8 flex justify-between items-center">
            <div class="text-2xl font-bold hero-gradient">Jadvinder Daudhria</div>
            <div class="flex space-x-6">
                <a href="https://linkedin.com/in/jadvinderd" class="text-2xl hover:text-purple-600"><i class="fa-brands fa-linkedin"></i></a>
                <a href="mailto:j.daudhria@gmail.com" class="text-2xl hover:text-purple-600"><i class="fa-solid fa-envelope"></i></a>
            </div>
        </div>
    </footer>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') document.documentElement.classList.add('dark');
        updateIcons(currentTheme === 'dark');
        function updateIcons(isDark) {
            sunIcon.classList.toggle('hidden', !isDark);
            moonIcon.classList.toggle('hidden', isDark);
        }
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateIcons(isDark);
        });
    </script>
</body>
